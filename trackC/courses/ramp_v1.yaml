# Ramp course with one fixed friction coefficient everywhere: the nominal case for watching the Go2 climb.
# Same geometry as debug_v03 (3 m lower flat, 6 m ramp at 10 deg, 3 m upper flat, 3 m wide), no friction regions
# and no obstacles. The whole surface is base ground, mu = 0.50, which matches the MPC's assumed mu
# (config.mpc_params['mu']), so the controller's friction model is exactly right here.
# World frame (decision A1): origin at the back-right inner wall corner; x forward, y left (0 to 3 m), z up.
#
# Build the scene (once, and again after any edit):
#   python -m trackC.terrain_gen trackC/courses/ramp_v1.yaml
# Watch a run (macOS: mjpython; Linux/WSL: python):
#   mjpython -m trackA.sim.run_waypoints --course trackC/courses/ramp_v1.yaml --mpc perfoot --timeout 60
#
# There are no regions, so a seed changes nothing: the base ground is always 0.5.

name: ramp_v1

course:
  width: 3.0                                   # between inner wall faces: y from 0 (right) to 3 (left)
  lower_flat: {length: 3.0}                    # starts at the back wall, x = 0
  ramp: {length_along_slope: 6.0, angle_deg: 10}
  upper_flat: {length: 3.0}
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5                          # start and goal must be at least this far from every wall
  start: [0.8, 1.5]                            # 0.8 m in front of the back wall, on the centerline
  goal: [11.1, 1.5]                            # 0.81 m before the end wall (x = 11.91): room for the robust footprint
  start_zone: {x: [0.8, 1.4], y: [0.6, 2.4], yaw_deg: 15}   # seeded start poses are drawn from here (A1.1, start_pose.py)

friction: {base: 0.5}                          # base ground; region classes and the friction set are in trackC/course_spec.py

regions: []

obstacles: []
