# Test course: the plain ramp (3 m lower flat, 6 m ramp at 10 deg, 3 m upper flat) with friction 0.3 everywhere,
# the lower limit (decision C3). No regions, no obstacles: the quickest check of a controller at mu = 0.3 on the ramp.
# World frame (decision A1): origin at the back-right inner wall corner; x forward, y left (0 to 3 m), z up.
#
# Build the scene:   python -m trackC.terrain_gen trackC/courses/ramp_mu03_v1.yaml
# Batch run:         python -m trackC.batch --course trackC/courses/ramp_mu03_v1.yaml --seeds 5

name: ramp_mu03_v1

course:
  width: 3.0                                   # between inner wall faces: y from 0 (right) to 3 (left)
  lower_flat: {length: 3.0}                    # starts at the back wall, x = 0
  ramp: {length_along_slope: 6.0, angle_deg: 10}
  upper_flat: {length: 3.0}
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5                          # start and goal must be at least this far from every wall
  start: [0.8, 1.5]                            # 0.8 m in front of the back wall, on the centerline
  goal: [10.91, 1.5]                           # 1.0 m from the end wall (x = 11.91): team rule, leaves room for the robust footprint
  start_zone: {x: [0.8, 1.2], y: [0.9, 2.1], yaw_deg: 15}   # seeded starts (A1.1); in line with the 1.2 m gateway, see start_pose.py

friction: {base: 0.3}                          # everything 0.3: the lower limit (decision C3)

regions: []

obstacles: []
