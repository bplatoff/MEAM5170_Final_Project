# Mixed course for stage 2 and 3 evaluation (decisions A3.1, A3.3, C3).
# World frame (A1): origin at the back-right inner wall corner; x forward, y left (0 to 3 m), z up.
#
# Layout, from start to goal:
#   gateway   1.2 m opening at the bottom of the ramp (x = 2.5), centered. Passable by robust and learned.
#   barrier   mid-ramp (x = 5.95), attached to the right wall; leaves `gap` to the left wall. The batch runner sweeps
#             gap (about 0.6 to 1.1 m) and variant (a 0.3 or a 0.7/0.8 patch around the gap). Robust needs about
#             1.0 m and learned about 0.6 to 0.75 m (provisional, locked after task 2.5).
#   passage   1.2 m opening on the upper flat (x = 9.6), centered, so the robot turns back from the gap.
# Friction (C3): 0.3 patches where the robot turns or passes obstacles, high patches elsewhere, base 0.5.
#
# Build one variant:     python -m trackC.terrain_gen trackC/courses/mixed_v1.yaml --gap 0.8 --variant high
# Plan view:             python -m trackC.visualize_course trackC/courses/mixed_v1.yaml --gap 0.8 --out mixed.png
# Without --gap/--variant the file defaults below are used and the scene is named plain `mixed_v1`.

name: mixed_v1

course:
  width: 3.0                                   # between inner wall faces: y from 0 (right) to 3 (left)
  lower_flat: {length: 3.0}                    # starts at the back wall, x = 0
  ramp: {length_along_slope: 6.0, angle_deg: 10}
  upper_flat: {length: 3.0}
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5                          # start and goal at least this far from every wall (A1.1, A3.3)
  obstacle_clearance: 1.0                      # and at least this far from every obstacle
  start: [0.8, 1.5]                            # nominal start; the start-pose sampler (2.3d) draws around the lower flat
  goal: [11.1, 1.5]                            # fixed for every run (A3.3): 1.4 m past the passage, 0.81 m from the end wall

friction: {base: 0.5}                          # base ground; region classes and the friction set are in trackC/course_spec.py

mid_ramp_gap:
  x: 5.95                                      # barrier center along the course, mid-ramp
  thickness: 0.3                               # barrier size along x
  height: 0.4
  gap: 1.1                                     # default opening to the left wall [m]; --gap overrides
  variant: low                                 # patch around the gap: low (0.3) or high (0.7 / 0.8); --variant overrides
  patch: {before: 1.2, after: 1.2, margin: 0.5}   # patch spans 1.2 m before and after the barrier, and from 0.5 m below
                                                   # the gap's lower edge up to the left wall

# Regions later in the list win where they overlap; the gap patch is added after all of these.
regions:
  - {id: lower_medium, class: medium, polygon: [[0.3, 2.1], [1.9, 2.1], [1.9, 2.9], [0.3, 2.9]]}
  - {id: gate_exit,    class: low,    polygon: [[2.6, 0.9], [3.6, 0.9], [3.6, 2.1], [2.6, 2.1]]}   # turn after the gateway; crosses the bottom crease
  - {id: ramp_right,   class: high,   polygon: [[3.8, 0.0], [5.4, 0.0], [5.4, 1.2], [3.8, 1.2]]}
  - {id: top_turn,     class: low,    polygon: [[8.6, 0.9], [9.45, 0.9], [9.45, 2.1], [8.6, 2.1]]}  # turn into the passage; crosses the top crease
  - {id: upper_high,   class: high,   polygon: [[9.8, 0.6], [11.0, 0.6], [11.0, 2.4], [9.8, 2.4]]}

obstacles:
  - {id: gate_right, center: [2.5, 0.45],  size: [0.2, 0.9], height: 0.4}
  - {id: gate_left,  center: [2.5, 2.55],  size: [0.2, 0.9], height: 0.4}
  - {id: pass_right, center: [9.6, 0.45],  size: [0.2, 0.9], height: 0.4}
  - {id: pass_left,  center: [9.6, 2.55],  size: [0.2, 0.9], height: 0.4}
