# Test course: the mixed_v1 layout with friction 0.3 everywhere (the lower limit, decision C3).
# Same gateway, mid-ramp barrier (--gap), passage, start zone and goal as mixed_v1, but no friction patches: every
# surface is 0.3. Keep --variant low (the default) so the gap patch is 0.3 too; --variant high would add a 0.7/0.8
# patch. Use it to test controllers at the friction the robust controller is built for (mu_lo = 0.3) on the obstacle
# layout they will really face.
#
# Build one gap:         python -m trackC.terrain_gen trackC/courses/mixed_mu03_v1.yaml --gap 1.1
# Batch run:             python -m trackC.batch --course trackC/courses/mixed_mu03_v1.yaml --gaps 0.8:1.1:0.1 --variants low

name: mixed_mu03_v1

course:
  width: 3.0                                   # between inner wall faces: y from 0 (right) to 3 (left)
  lower_flat: {length: 3.0}                    # starts at the back wall, x = 0
  ramp: {length_along_slope: 6.0, angle_deg: 10}
  upper_flat: {length: 3.0}
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5                          # start and goal at least this far from every wall (A1.1, A3.3)
  obstacle_clearance: 1.0                      # and at least this far from every obstacle
  start: [0.8, 1.5]                            # nominal start (center-back of the start zone)
  goal: [10.91, 1.5]                           # fixed for every run (A3.3): 1.0 m from the end wall (x = 11.91), 1.21 m past the passage
  start_zone: {x: [0.8, 1.2], y: [0.9, 2.1], yaw_deg: 15}   # seeded starts (A1.1); in line with the 1.2 m gateway, see start_pose.py

friction: {base: 0.3}                          # everything 0.3: the lower limit

mid_ramp_gap:
  x: 5.95                                      # barrier center along the course, mid-ramp
  thickness: 0.3                               # barrier size along x
  height: 0.4
  gap: 1.1                                     # default opening to the left wall [m]; --gap overrides
  variant: low                                 # patch around the gap: low (0.3) or high (0.7 / 0.8); --variant overrides
  patch: {before: 1.2, after: 1.2, margin: 0.5}   # patch spans 1.2 m before and after the barrier, and from 0.5 m below
                                                   # the gap's lower edge up to the left wall

# No friction regions: the base covers everything (the gap patch is added by mid_ramp_gap).
regions: []

obstacles:
  - {id: gate_right, center: [2.5, 0.45],  size: [0.2, 0.9], height: 0.4}
  - {id: gate_left,  center: [2.5, 2.55],  size: [0.2, 0.9], height: 0.4}
  - {id: pass_right, center: [9.6, 0.45],  size: [0.2, 0.9], height: 0.4}
  - {id: pass_left,  center: [9.6, 2.55],  size: [0.2, 0.9], height: 0.4}
