# Hand-designed debug course matching parameter sheet v0.3.
# Plan-view coordinates: x along the course, y across it. The Go2 spawns at (0, 0).
name: debug_v03

course:
  width: 3.0                                   # between inner wall faces
  lower_flat: {start: -0.8, length: 3.0}       # back wall 0.8 m behind the spawn point
  ramp: {length_along_slope: 6.0, angle_deg: 10}
  upper_flat: {length: 3.0}
  base_class: medium                           # friction of everything not covered by a region
  ramp_mu_floor: 0.25                          # sheet: 0.25 to 0.30 initially; 0.20 only as a stress test
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5                          # start and goal must be at least this far from every wall
  start: [0.0, 0.0]
  goal: [10.5, 0.0]

friction_classes: {low: 0.20, medium: 0.50, high: 0.80}
randomize_ranges: {low: [0.15, 0.25], medium: [0.40, 0.60], high: [0.70, 0.90]}

# 8 polygonal regions. Give either `class` or an explicit `mu`. Two regions cross a crease on purpose.
regions:
  - {id: ice_lower,   class: low,  polygon: [[0.6, -1.5], [1.5, -1.5], [1.5, -0.6], [0.9, 0.1]]}
  - {id: dry_lower,   class: high, polygon: [[0.2, 0.5], [1.4, 0.4], [1.3, 1.5], [0.3, 1.5]]}
  - {id: snow_crease, mu: 0.30,    polygon: [[1.6, -0.4], [2.6, -0.6], [3.2, 0.2], [2.7, 0.9], [1.8, 0.7]]}
  - {id: dry_ramp,    class: high, polygon: [[3.6, 0.3], [5.6, 0.3], [5.4, 1.5], [3.8, 1.5]]}
  - {id: snow_ramp,   mu: 0.30,    polygon: [[5.0, -1.5], [7.2, -1.5], [6.4, -0.3]]}
  - {id: snow_top,    mu: 0.30,    polygon: [[7.4, -1.0], [8.7, -1.1], [8.6, 0.2], [7.5, 0.3]]}
  - {id: ice_upper,   class: low,  polygon: [[8.9, -0.6], [9.7, -0.7], [9.8, 0.8], [8.8, 0.6]]}
  - {id: dry_upper,   class: high, polygon: [[9.9, -1.5], [10.9, -1.5], [10.9, 0.0], [9.9, 0.0]]}

# 4 obstacles: a gateway on the lower flat and a narrow passage on the upper flat.
# The passage width (0.7 m here) is a placeholder until the robust tube radius is measured.
obstacles:
  - {id: gate_right, center: [1.95, -1.1], size: [0.2, 0.8], height: 0.4}
  - {id: gate_left,  center: [1.95, 0.9],  size: [0.2, 1.2], height: 0.4}
  - {id: pass_right, center: [10.1, -0.925], size: [0.2, 1.15], height: 0.4}
  - {id: pass_left,  center: [10.1, 0.925],  size: [0.2, 1.15], height: 0.4}
