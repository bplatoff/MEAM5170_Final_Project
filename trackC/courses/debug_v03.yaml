# Hand-designed debug course matching parameter sheet v0.3.
# World frame (decision A1): origin at the back-right inner wall corner; x forward, y left (0 to 3 m), z up.
# Moved from the old spawn-at-origin frame by (+0.8, +1.5). Layout predates decision A3.1; kept for the logger tests.
# Friction follows C3: the `low` regions (ice) are now 0.3, not 0.20.
name: debug_v03

course:
  width: 3.0                                   # between inner wall faces
  lower_flat: {length: 3.0}                    # starts at the back wall, x = 0
  ramp: {length_along_slope: 6.0, angle_deg: 10}
  upper_flat: {length: 3.0}
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5                          # start and goal must be at least this far from every wall
  obstacle_clearance: 0.4                      # legacy layout: the goal sits 0.46 m from the passage (new courses use 1.0, A3.3)
  start: [0.8, 1.5]
  goal: [11.3, 1.5]
  robust_planning: false                       # legacy layout for the logger tests: no room for the robust footprint
  start_zone: {x: [0.8, 1.4], y: [0.6, 2.4], yaw_deg: 15}   # seeded start poses are drawn from here (A1.1, start_pose.py)

friction: {base: 0.5}                          # base ground; region classes and the friction set are in trackC/course_spec.py

# 8 polygonal regions. Give either `class` or an explicit `mu`. Two regions cross a crease on purpose.
regions:
  - {id: ice_lower,   class: low,  polygon: [[1.4, 0], [2.3, 0], [2.3, 0.9], [1.7, 1.6]]}
  - {id: dry_lower,   class: high, polygon: [[1, 2], [2.2, 1.9], [2.1, 3], [1.1, 3]]}
  - {id: snow_crease, mu: 0.30,    polygon: [[2.4, 1.1], [3.4, 0.9], [4, 1.7], [3.5, 2.4], [2.6, 2.2]]}
  - {id: dry_ramp,    class: high, polygon: [[4.4, 1.8], [6.4, 1.8], [6.2, 3], [4.6, 3]]}
  - {id: snow_ramp,   mu: 0.30,    polygon: [[5.8, 0], [8, 0], [7.2, 1.2]]}
  - {id: snow_top,    mu: 0.30,    polygon: [[8.2, 0.5], [9.5, 0.4], [9.4, 1.7], [8.3, 1.8]]}
  - {id: ice_upper,   class: low,  polygon: [[9.7, 0.9], [10.5, 0.8], [10.6, 2.3], [9.6, 2.1]]}
  - {id: dry_upper,   class: high, polygon: [[10.7, 0], [11.7, 0], [11.7, 1.5], [10.7, 1.5]]}

# 4 obstacles: a gateway on the lower flat and a narrow passage on the upper flat.
# The passage width (0.7 m here) is a placeholder until the robust tube radius is measured.
obstacles:
  - {id: gate_right, center: [2.75, 0.4], size: [0.2, 0.8], height: 0.4}
  - {id: gate_left,  center: [2.75, 2.4],  size: [0.2, 1.2], height: 0.4}
  - {id: pass_right, center: [10.9, 0.575], size: [0.2, 1.15], height: 0.4}
  - {id: pass_left,  center: [10.9, 2.425],  size: [0.2, 1.15], height: 0.4}
