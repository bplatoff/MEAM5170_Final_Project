# Flat course, one friction value everywhere (stage 1). Same footprint as the ramp courses with the ramp set to 0 deg.
# World frame (decision A1): origin at the back-right inner wall corner; x forward, y left (0 to 3 m), z up.
#
# Build the scene:        python -m trackC.terrain_gen trackC/courses/flat_v1.yaml
# Plan view png:          python -m trackC.visualize_course trackC/courses/flat_v1.yaml --out flat_v1.png
# 3D viewer:              python -m trackC.terrain_gen trackC/courses/flat_v1.yaml --out /tmp/scene_flat_v1.xml
#                         python -m mujoco.viewer --mjcf=/tmp/scene_flat_v1.xml

name: flat_v1

course:
  width: 3.0                                   # between inner wall faces: y from 0 (right) to 3 (left)
  lower_flat: {length: 3.0}                    # starts at the back wall, x = 0
  ramp: {length_along_slope: 6.0, angle_deg: 0}
  upper_flat: {length: 3.0}
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5                          # start and goal must be at least this far from every wall
  start: [0.8, 1.5]                            # 0.8 m in front of the back wall, on the centerline
  goal: [11.0, 1.5]                            # 1.0 m from the end wall (x = 12.0): team rule, leaves room for the robust footprint
  start_zone: {x: [0.8, 1.2], y: [0.9, 2.1], yaw_deg: 15}   # seeded starts (A1.1); in line with the 1.2 m gateway, see start_pose.py

friction: {base: 0.5}                          # base ground; region classes and the friction set are in trackC/course_spec.py

regions: []

obstacles: []
