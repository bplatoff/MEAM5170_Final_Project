# Track A test course for the mid-layer tube MPC (task 2.4). Temporary: replaced by Track C's mixed_v1.
# Same profile and frame as debug_v03: x along the course, y across it, the Go2 spawns at (0, 0).
#
# Every opening is 1.7 m because the temporary planner uses one 0.483 m circle plus the 0.263 m tube, which needs
# 2 * (0.483 + 0.263) = 1.49 m. The back wall is 1.0 m behind the spawn so seeded spawns stay outside the inflated wall.
#
# Install the scene once per environment:
#   python -m trackC.terrain_gen trackA/courses/midlayer_test_v1.yaml

name: midlayer_test_v1

course:
  width: 3.0
  lower_flat: {start: -1.0, length: 3.0}
  ramp: {length_along_slope: 6.0, angle_deg: 10}
  upper_flat: {length: 3.0}
  base_class: medium
  ramp_mu_floor: 0.30
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5
  start: [0.0, 0.0]
  goal: [10.0, 0.0]

friction_classes: {low: 0.30, medium: 0.50, high: 0.80}
randomize_ranges: {low: [0.30, 0.30], medium: [0.50, 0.50], high: [0.70, 0.80]}

regions:
  - {id: low_gate,    mu: 0.30, polygon: [[1.0, -0.9], [2.4, -0.9], [2.4, 0.9], [1.0, 0.9]]}
  - {id: low_barrier, mu: 0.30, polygon: [[4.2, -0.1], [6.0, -0.1], [6.0, 1.5], [4.2, 1.5]]}
  - {id: high_ramp,   mu: 0.80, polygon: [[6.5, -1.5], [7.7, -1.5], [7.7, -0.2], [6.5, -0.2]]}

obstacles:
  - {id: gate_right, center: [1.75, -1.175], size: [0.2, 0.65], height: 0.4}
  - {id: gate_left,  center: [1.75,  1.175], size: [0.2, 0.65], height: 0.4}
  - {id: barrier,    center: [5.1, -0.85],   size: [0.3, 1.3],  height: 0.4}
  - {id: pass_right, center: [9.1, -1.175],  size: [0.2, 0.65], height: 0.4}
  - {id: pass_left,  center: [9.1,  1.175],  size: [0.2, 0.65], height: 0.4}
