# Track A test course for the mid-layer tube MPC (task 2.4). Temporary: replaced by Track C's mixed_v1.
# Same profile as debug_v03. World frame (A1): origin at the back-right inner wall corner, x forward, y left (0 to 3 m).
# Moved from the old frame by (+1.0, +1.5), so the start (1.0, 1.5) is still 1.0 m in front of the back wall.
#
# Every opening is 1.7 m because the temporary planner uses one 0.483 m circle plus the 0.263 m tube, which needs
# 2 * (0.483 + 0.263) = 1.49 m. The back wall is 1.0 m behind the spawn so seeded spawns stay outside the inflated wall.
#
# Install the scene once per environment:
#   python -m trackC.terrain_gen trackA/courses/midlayer_test_v1.yaml

name: midlayer_test_v1

course:
  width: 3.0
  lower_flat: {length: 3.0}                    # starts at the back wall, x = 0
  ramp: {length_along_slope: 6.0, angle_deg: 10}
  upper_flat: {length: 3.0}
  base_class: medium
  ramp_mu_floor: 0.30
  walls: {height: 0.5, thickness: 0.1}
  wall_clearance: 0.5
  start: [1, 1.5]
  goal: [11, 1.5]

friction_classes: {low: 0.30, medium: 0.50, high: 0.80}
randomize_ranges: {low: [0.30, 0.30], medium: [0.50, 0.50], high: [0.70, 0.80]}

regions:
  - {id: low_gate,    mu: 0.30, polygon: [[2, 0.6], [3.4, 0.6], [3.4, 2.4], [2, 2.4]]}
  - {id: low_barrier, mu: 0.30, polygon: [[5.2, 1.4], [7, 1.4], [7, 3], [5.2, 3]]}
  - {id: high_ramp,   mu: 0.80, polygon: [[7.5, 0], [8.7, 0], [8.7, 1.3], [7.5, 1.3]]}

obstacles:
  - {id: gate_right, center: [2.75, 0.325], size: [0.2, 0.65], height: 0.4}
  - {id: gate_left,  center: [2.75, 2.675], size: [0.2, 0.65], height: 0.4}
  - {id: barrier,    center: [6.1, 0.65],   size: [0.3, 1.3],  height: 0.4}
  - {id: pass_right, center: [10.1, 0.325],  size: [0.2, 0.65], height: 0.4}
  - {id: pass_left,  center: [10.1, 2.675],  size: [0.2, 0.65], height: 0.4}
